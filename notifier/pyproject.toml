[project]
name = "notifier"
version = "0.1.0"
description = "Webhook-to-UI broadcast notification service"
readme = "README.md"
authors = [
    { name = "MironovSergei", email = "waityourletters@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifier"]
