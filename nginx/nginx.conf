upstream yallmp {
    server yallmp:5000;
}

upstream checkr {
    server checkr:5000;
}

upstream llogr {
    server llogr:8000;
}

map $http_x_request_id $request_id_value {
    default $http_x_request_id;
    ""      $request_id;
}

# JWT claims forwarded by upstream auth proxy (e.g. OAuth2-proxy, Kong, Envoy)
map $http_x_jwt_sub $jwt_sub_claim {
    default $http_x_jwt_sub;
    ""      "";
}

map $http_x_jwt_tenant $jwt_tenant_claim {
    default $http_x_jwt_tenant;
    ""      "";
}

# Build x-group-id as "tenant/subject" for log separation
map $jwt_tenant_claim $safe_group {
    ""      "unknown";
    default $jwt_tenant_claim;
}

map $jwt_sub_claim $safe_user {
    ""      "anonymous";
    default $jwt_sub_claim;
}

map "$safe_group/$safe_user" $group_id_value {
    default "$safe_group/$safe_user";
}

log_format main '$remote_addr - $remote_user [$time_local] "$request" '
               '$status $body_bytes_sent "$http_referer" '
               '"$http_user_agent" request_id=$request_id_value';

server {
    listen 80;
    access_log /var/log/nginx/access.log main;

    # Return X-Request-ID to the client on every proxied response
    add_header X-Request-ID $request_id_value always;

    # yallmp: root_path=/ai, serves /ai/dashboard, /ai/health, /ai/llm/...
    location /ai/ {
        proxy_pass http://yallmp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_value;
        proxy_set_header X-Group-ID $group_id_value;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # checkr: root_path=/validators, serves /validators/playground, /validators/static/...
    location /validators/ {
        proxy_pass http://checkr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_value;
    }

    # llogr: root_path=/llogr, serves /llogr/, /llogr/api/public/...
    location /llogr/ {
        proxy_pass http://llogr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_value;
        proxy_set_header X-Group-ID $group_id_value;
    }

    # minio S3 API — serves presigned URLs for llogr log downloads
    location /s3/ {
        rewrite ^/s3/(.*) /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_value;
    }

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
