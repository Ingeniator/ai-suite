upstream yallmp {
    server yallmp:5000;
}

upstream checkr {
    server checkr:5000;
}

upstream llogr {
    server llogr:8000;
}

server {
    listen 80;

    # yallmp: root_path=/ai, serves /ai/dashboard, /ai/health, /ai/llm/...
    location /ai/ {
        proxy_pass http://yallmp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # checkr: root_path=/validators, serves /validators/playground, /validators/static/...
    location /validators/ {
        proxy_pass http://checkr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # llogr: root_path=/llogr, serves /llogr/, /llogr/api/public/...
    location /llogr/ {
        proxy_pass http://llogr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # minio S3 API — serves presigned URLs for llogr log downloads
    location /s3/ {
        rewrite ^/s3/(.*) /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
