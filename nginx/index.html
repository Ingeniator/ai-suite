<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-suite</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #1a1a1a; padding: 48px 24px; }
h1 { font-size: 24px; font-weight: 600; margin-bottom: 24px; }
table { width: 100%; max-width: 960px; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
th { text-align: left; padding: 10px 16px; background: #fafafa; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #666; border-bottom: 1px solid #eee; }
td { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; font-size: 14px; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
a { color: #2563eb; text-decoration: none; }
a:hover { text-decoration: underline; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
.tag-proxy { background: #dbeafe; color: #1e40af; }
.tag-validation { background: #dcfce7; color: #166534; }
.tag-observability { background: #fef3c7; color: #92400e; }
.tag-storage { background: #f3e8ff; color: #6b21a8; }
.tag-dev { background: #f1f5f9; color: #475569; }
.tag-annotation { background: #fce7f3; color: #9d174d; }
.tag-agent { background: #ccfbf1; color: #0f766e; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #ccc; }
.dot.up { background: #22c55e; }
.dot.down { background: #ef4444; }
btn { border: none; padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 500; cursor: pointer; }
.btn-test { background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 500; cursor: pointer; }
.btn-test:hover { background: #c7d2fe; }
.btn-test:disabled { opacity: .5; cursor: wait; }
#result-panel { max-width: 960px; margin-top: 24px; }
.result-box { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; overflow: hidden; }
.result-header { padding: 10px 16px; background: #fafafa; border-bottom: 1px solid #eee; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.result-header .elapsed { font-weight: 400; color: #888; font-size: 12px; }
.result-body { padding: 16px; font-family: "SF Mono", "Fira Code", monospace; font-size: 13px; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; background: #fafafa; }
.result-ok { border-left: 3px solid #22c55e; }
.result-err { border-left: 3px solid #ef4444; }
.embed-frame { display: none; max-width: 960px; margin-top: 16px; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.12); border: 1px solid #e5e7eb; }
.embed-frame.open { display: block; }
.embed-frame iframe { display: block; width: 100%; height: 520px; border: none; background: #1a1a1a; }
</style>
</head>
<body>
<h1>ai-suite</h1>
<table>
  <thead>
    <tr><th>Service</th><th>Description</th><th>Pages</th><th>Status</th><th>Test</th></tr>
  </thead>
  <tbody id="services"></tbody>
</table>
<div id="embed-panel"></div>
<div id="result-panel"></div>
<script>
const services = [
  {
    name: "yallmp",
    tag: "proxy", tagClass: "tag-proxy",
    desc: "LLM proxy with circuit breaker, tracing & prompt hub",
    health: "/ai/health",
    pages: [
      { label: "Dashboard", href: "/ai/dashboard" },
      { label: "Search", href: "/ai/search/ui" },
      { label: "API docs", href: "/ai/docs" },
    ],
    test: {
      label: "Chat completion",
      method: "POST",
      url: "/ai/llm/v1/chat/completions",
      headers: { "Content-Type": "application/json" },
      body: {
        model: "llama-3.2-3b-instruct",
        messages: [{ role: "user", content: "Say hello in one sentence." }],
        max_tokens: 64
      }
    }
  },
  {
    name: "checkr",
    tag: "validation", tagClass: "tag-validation",
    desc: "Multi-gate dataset validation service",
    health: "/validators/health",
    pages: [
      { label: "Playground", href: "/validators/playground" },
      { label: "Async Playground", href: "/validators/async-playground" },
      { label: "API docs", href: "/validators/docs" },
    ],
    test: {
      label: "Validate dataset",
      method: "POST",
      url: "/validators/api/v0/g-eval",
      headers: { "Content-Type": "application/json" },
      body: {
        dataset: [
          { messages: [
            { role: "user", content: "What is the capital of France?" },
            { role: "assistant", content: "The capital of France is Paris." }
          ]},
          { messages: [
            { role: "user", content: "What is 2+2?" },
            { role: "assistant", content: "2+2 equals 4." }
          ]}
        ],
        options: {
          criteria: "correctness",
          description: "Is the answer factually correct?"
        }
      }
    }
  },
  {
    name: "llogr",
    tag: "observability", tagClass: "tag-observability",
    desc: "Langfuse-compatible LLM trace collector",
    health: "/llogr/health",
    pages: [
      { label: "Log browser", href: "/llogr/" },
      { label: "API docs", href: "/llogr/docs" },
    ],
    test: {
      label: "Ingest event",
      method: "POST",
      url: "/llogr/api/public/ingestion",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer pk-local:sk-local" },
      body: {
        batch: [{
          id: "test-" + Date.now(),
          type: "generation-create",
          timestamp: new Date().toISOString(),
          body: {
            id: "gen-test-" + Date.now(),
            name: "test-from-index-page",
            model: "llama-3.2-3b-instruct",
            input: [{ role: "user", content: "Hello" }],
            output: { role: "assistant", content: "Hi there!" },
            usage: { input: 5, output: 8 }
          }
        }]
      }
    }
  },
  {
    name: "dataimporter",
    tag: "observability", tagClass: "tag-observability",
    desc: "Browse & search logs across S3 / ClickHouse datasources",
    health: "/dataimporter/health",
    pages: [
      { label: "Browser", href: "/dataimporter/" },
      { label: "API docs", href: "/dataimporter/docs" },
    ],
    test: {
      label: "List datasources",
      method: "GET",
      url: "/dataimporter/api/public/datasources",
      headers: {},
      body: null
    }
  },
  {
    name: "aihub",
    tag: "observability", tagClass: "tag-observability",
    desc: "Leaderboard & chat history hub with Prometheus metrics",
    health: "/ai/hub/health",
    pages: [
      { label: "API docs", href: "/ai/hub/docs" },
    ],
    test: {
      label: "List leaderboard",
      method: "GET",
      url: "/ai/hub/api/v1/leaderboard",
      headers: {},
      body: null
    }
  },
  {
    name: "langfuse",
    tag: "observability", tagClass: "tag-observability",
    desc: "Self-hosted LLM observability & tracing platform",
    health: null,
    pages: [
      { label: "Dashboard", href: "//:3031" },
    ],
    test: null
  },
  {
    name: "minio",
    tag: "storage", tagClass: "tag-storage",
    desc: "S3-compatible object storage",
    health: null,
    pages: [
      { label: "Console", href: "//:9002" },
    ],
    test: null
  },
  {
    name: "annotator-mock",
    tag: "annotation", tagClass: "tag-annotation",
    desc: "Tagme-compatible mock — simulates crowd annotation for CEFS ground-truth loop",
    health: "/annotator-mock/health",
    pages: [
      { label: "API docs", href: "/annotator-mock/docs" },
      { label: "Pools", href: "/annotator-mock/api/v0/pools" },
      { label: "TUI", href: "/annotator-tui/", embed: true },
    ],
    tests: [
      {
        label: "Hardcoded pool",
        method: "GET",
        url: "/annotator-mock/api/v0/pools/hardcoded",
        headers: {},
        body: null
      },
      {
        label: "Run annotation",
        method: "POST",
        url: "/annotator-mock/_test/run",
        headers: { "Content-Type": "application/json" },
        body: null,
        // implemented below as a multi-step test
        multiStep: true
      },
    ]
  },
  {
    name: "typical-agent",
    tag: "agent", tagClass: "tag-agent",
    desc: "SRE incident investigation agent — classify, diagnose & remediate alerts via LLM pipeline",
    health: "/typical-agent/health",
    pages: [
      { label: "API docs", href: "/typical-agent/docs" },
      { label: "Scenarios", href: "/typical-agent/api/v0/scenarios" },
    ],
    tests: [
      {
        label: "List scenarios",
        method: "GET",
        url: "/typical-agent/api/v0/scenarios",
        headers: {},
        body: null
      },
      {
        label: "Run all",
        method: "POST",
        url: "/typical-agent/api/v0/runs/all",
        headers: {},
        body: null,
        multiStep: true
      },
    ]
  },
  {
    name: "meta-evaluator",
    tag: "annotation", tagClass: "tag-annotation",
    desc: "CEFS orchestrator — bridges dataset-mock → annotator-mock, computes AI evaluator quality (accuracy, Cohen's κ)",
    health: "/meta-evaluator/health",
    pages: [
      { label: "API docs",  href: "/meta-evaluator/docs" },
      { label: "Runs",      href: "/meta-evaluator/api/v0/runs" },
      { label: "Summary",   href: "/meta-evaluator/api/v0/summary" },
    ],
    tests: [
      {
        label: "Summary",
        method: "GET",
        url: "/meta-evaluator/api/v0/summary",
        headers: {},
        body: null
      },
      {
        label: "Full CEFS run",
        method: "POST",
        url: "/meta-evaluator/_test/run",
        headers: { "Content-Type": "application/json" },
        body: null,
        multiStep: true
      },
    ]
  },
  {
    name: "dataset-mock",
    tag: "dev", tagClass: "tag-dev",
    desc: "Mock dataset service for testing the import UX",
    health: "/dataset-mock/_mock/datasets",
    pages: [
      { label: "Datasets", href: "/dataset-mock/_mock/datasets" },
    ],
    tests: [
      {
        label: "List datasets",
        method: "GET",
        url: "/dataset-mock/_mock/datasets",
        headers: {},
        body: null
      },
      {
        label: "Clean datasets",
        method: "DELETE",
        url: "/dataset-mock/_mock/datasets",
        headers: {},
        body: null
      },
    ]
  },
];

const tbody = document.getElementById("services");
const panel = document.getElementById("result-panel");

function resolveUrl(path) {
  if (!path) return null;
  if (/^\/\/:\d+/.test(path)) {
    const rest = path.slice(3); // "9100" or "9100/_mock/datasets"
    const slash = rest.indexOf('/');
    const port = slash === -1 ? rest : rest.slice(0, slash);
    const tail = slash === -1 ? '' : rest.slice(slash);
    return location.protocol + '//' + location.hostname + ':' + port + tail;
  }
  return path;
}

const embedPanel = document.getElementById("embed-panel");
let activeEmbed = null;  // currently open embed href

function toggleEmbed(href, label) {
  if (activeEmbed === href) {
    // close
    embedPanel.innerHTML = "";
    activeEmbed = null;
  } else {
    activeEmbed = href;
    embedPanel.innerHTML = `
      <div class="embed-frame open">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#fafafa;border-bottom:1px solid #eee;">
          <span style="font-size:13px;font-weight:600">${label}</span>
          <span style="display:flex;gap:10px;align-items:center;">
            <a href="${href}" target="_blank" style="font-size:12px">open in tab ↗</a>
            <button onclick="toggleEmbed('${href}','${label}')" style="border:none;background:none;cursor:pointer;font-size:16px;color:#666">✕</button>
          </span>
        </div>
        <iframe src="${href}" allowfullscreen></iframe>
      </div>`;
  }
}

services.forEach(s => {
  const pages = s.pages.map(p => {
    if (p.embed) {
      return `<a href="#" onclick="toggleEmbed('${resolveUrl(p.href)}','${p.label}');return false">${p.label}</a>`;
    }
    return `<a href="${resolveUrl(p.href)}">${p.label}</a>`;
  }).join(" &middot; ");

  const allTests = s.tests || (s.test ? [s.test] : []);
  const testCell = allTests.length
    ? allTests.map((t, i) => `<button class="btn-test" id="btn-${s.name}-${i}">${t.label}</button>`).join(" ")
    : "&mdash;";

  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><strong>${s.name}</strong> <span class="tag ${s.tagClass}">${s.tag}</span></td>
    <td>${s.desc}</td>
    <td>${pages}</td>
    <td id="status-${s.name}"><span class="dot"></span>...</td>
    <td>${testCell}</td>
  `;
  tbody.appendChild(tr);

  if (s.health) {
    fetch(resolveUrl(s.health)).then(r => {
      const el = document.getElementById("status-" + s.name);
      el.innerHTML = r.ok ? '<span class="dot up"></span>ok' : '<span class="dot down"></span>err';
    }).catch(() => {
      document.getElementById("status-" + s.name).innerHTML = '<span class="dot down"></span>down';
    });
  } else {
    document.getElementById("status-" + s.name).innerHTML = '<span class="dot"></span>&mdash;';
  }

  allTests.forEach((t, i) => {
    document.getElementById(`btn-${s.name}-${i}`).addEventListener("click", () => runTest(s, t, i));
  });
});

async function runTest(s, t, i) {
  const btn = document.getElementById(`btn-${s.name}-${i}`);
  btn.disabled = true;
  btn.textContent = "running...";

  if (t.multiStep && s.name === "annotator-mock") {
    await runAnnotatorMockTest(btn, t.label);
    return;
  }
  if (t.multiStep && s.name === "typical-agent") {
    await runTypicalAgentAllTest(btn, t.label);
    return;
  }
  if (t.multiStep && s.name === "meta-evaluator") {
    await runCefsRunTest(btn, t.label);
    return;
  }

  const t0 = performance.now();
  try {
    const opts = { method: t.method, headers: t.headers };
    if (t.body) opts.body = JSON.stringify(t.body);
    const resp = await fetch(resolveUrl(t.url), opts);
    const elapsed = ((performance.now() - t0) / 1000).toFixed(2);
    const text = await resp.text();
    let display;
    try { display = JSON.stringify(JSON.parse(text), null, 2); } catch { display = text; }
    addResult(s.name, t.label, resp.ok || resp.status === 207, resp.status, elapsed, display);
  } catch (err) {
    const elapsed = ((performance.now() - t0) / 1000).toFixed(2);
    addResult(s.name, t.label, false, "ERR", elapsed, err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = t.label;
  }
}

async function runAnnotatorMockTest(btn, label) {
  const B = "/annotator-mock";
  const POOL = "a1b2c3d4-e5f6-7890-abcd-ef1234567890";
  const t0 = performance.now();
  const log = [];
  const step = (msg) => { log.push(msg); btn.textContent = msg; };

  try {
    // 1. dataset
    step("creating dataset…");
    const ds = await fetch(B + "/api/v0/datasets", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({name: "dashboard-test-" + Date.now(), access: "organization"})
    }).then(r => r.json());

    // 2. upload traces as JSONL blob
    step("uploading traces…");
    const jsonl = [
      {trace_id:"t1", score:0.42, verdict:"FAIL", llm_output:"sky is green"},
      {trace_id:"t2", score:0.93, verdict:"PASS", llm_output:"Paris is capital"},
      {trace_id:"t3", score:0.58, verdict:"PASS", llm_output:"water boils at 100C"},
    ].map(r => JSON.stringify(r)).join("\n");
    const fd = new FormData();
    fd.append("file", new Blob([jsonl], {type:"application/json"}), "traces.jsonl");
    await fetch(B + "/api/v0/datasets/" + ds.id + "/files", {method:"POST", body: fd});

    // 3. project
    step("creating project…");
    const proj = await fetch(B + "/api/v0/markup_project", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({name: "dashboard-test"})
    }).then(r => r.json());

    // 4. assign pool
    await fetch(B + "/api/v0/markup_project/" + proj.uid + "/pools/" + POOL, {method:"POST"});

    // 5. create task (overlap=3)
    step("creating task…");
    const task = await fetch(B + "/api/v0/tasks", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({project_id: proj.uid, dataset_id: ds.id, overlap: 3, name: "dashboard-test"})
    }).then(r => r.json());

    // 6. start
    step("starting annotation…");
    await fetch(B + "/api/v0/tasks/" + task.uid + "/start", {method:"POST"});

    // 7. poll
    step("waiting for DONE…");
    for (let i = 0; i < 60; i++) {
      await new Promise(r => setTimeout(r, 500));
      const {state} = await fetch(B + "/api/v0/tasks/" + task.uid + "/state").then(r => r.json());
      if (state === "DONE") break;
    }

    // 8. results
    step("fetching results…");
    const stats = await fetch(B + "/api/v0/statistics/task/" + task.uid).then(r => r.json());
    const asgns = await fetch(B + "/api/v0/assignments?task_id=" + task.uid).then(r => r.json());

    const summary = {
      task_id: task.uid,
      state: stats.state,
      items_total: stats.items_total,
      items_done: stats.items_done,
      assignments: asgns.items.map(a => ({
        annotator: a.marker_name,
        labels: a.items.map(it => it.result.label)
      }))
    };
    const elapsed = ((performance.now() - t0) / 1000).toFixed(2);
    addResult("annotator-mock", label, true, "OK", elapsed, JSON.stringify(summary, null, 2));
  } catch(err) {
    const elapsed = ((performance.now() - t0) / 1000).toFixed(2);
    addResult("annotator-mock", label, false, "ERR", elapsed, err.message + "\n" + log.join("\n"));
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

async function runTypicalAgentAllTest(btn, label) {
  const B = "/typical-agent";
  const t0 = performance.now();
  btn.textContent = "starting…";

  // Create the live log panel up front
  const panelId = "ta-all-" + Date.now();
  const div = document.createElement("div");
  div.className = "result-box result-ok";
  div.innerHTML = `
    <div class="result-header">
      <span><strong>typical-agent</strong> &mdash; Run all scenarios</span>
      <span class="elapsed" id="${panelId}-elapsed">starting…</span>
    </div>
    <div class="result-body" id="${panelId}-body" style="max-height:600px;line-height:1.6"></div>
  `;
  panel.prepend(div);

  const body = document.getElementById(`${panelId}-body`);
  const elapsedEl = document.getElementById(`${panelId}-elapsed`);

  function renderLogs(runs) {
    const statusIcon = s => s === "done" ? "✓" : s === "error" ? "✗" : "⋯";
    const statusColor = s => s === "done" ? "#16a34a" : s === "error" ? "#dc2626" : "#d97706";
    let html = "";
    for (const { run_id, scenario_id, run } of runs) {
      const icon = statusIcon(run.status);
      const color = statusColor(run.status);
      html += `<div style="margin-bottom:14px">`;
      html += `<div style="font-weight:600;color:${color}">${icon} ${escapeHtml(scenario_id)} <span style="font-weight:400;color:#888;font-size:11px">[${run.status}]</span></div>`;
      for (const line of (run.logs || [])) {
        html += `<div style="color:#555;padding-left:14px">${escapeHtml(line)}</div>`;
      }
      if (run.status === "done" && run.report) {
        const r = run.report;
        const c = r.classification;
        html += `<div style="padding-left:14px;color:#1e40af;margin-top:2px">`;
        html += `→ ${escapeHtml(c.type)} | ${escapeHtml(c.severity)} | ${escapeHtml(c.affected_component)} | quality ${r.quality?.score ?? "?"}/10`;
        html += `</div>`;
        html += `<div style="padding-left:14px"><a href="${escapeHtml(r.trace_url)}" target="_blank" style="font-size:12px">open trace ↗</a></div>`;
      }
      if (run.status === "error") {
        html += `<div style="padding-left:14px;color:#dc2626">${escapeHtml(run.error || "unknown error")}</div>`;
      }
      html += `</div>`;
    }
    body.innerHTML = html;
  }

  try {
    const { runs: runMeta } = await fetch(B + "/api/v0/runs/all", { method: "POST" }).then(r => r.json());
    btn.textContent = "running…";

    const state = runMeta.map(m => ({ ...m, run: { status: "running", logs: [], report: null, error: null } }));
    renderLogs(state);

    const done = new Set();
    while (done.size < state.length) {
      await new Promise(r => setTimeout(r, 1000));
      elapsedEl.textContent = ((performance.now() - t0) / 1000).toFixed(1) + "s";

      await Promise.all(state.map(async item => {
        if (done.has(item.run_id)) return;
        item.run = await fetch(B + "/api/v0/runs/" + item.run_id).then(r => r.json());
        if (item.run.status !== "running") done.add(item.run_id);
      }));

      renderLogs(state);
    }

    const allOk = state.every(item => item.run.status === "done");
    if (!allOk) div.className = "result-box result-err";
    elapsedEl.textContent = ((performance.now() - t0) / 1000).toFixed(2) + "s";

  } catch (err) {
    div.className = "result-box result-err";
    body.innerHTML = `<div style="color:#dc2626">${escapeHtml(err.message)}</div>`;
    elapsedEl.textContent = ((performance.now() - t0) / 1000).toFixed(2) + "s";
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

function addResult(name, label, ok, status, elapsed, body) {
  const div = document.createElement("div");
  div.className = "result-box " + (ok ? "result-ok" : "result-err");
  div.innerHTML = `
    <div class="result-header">
      <span><strong>${name}</strong> &mdash; ${label} &mdash; HTTP ${status}</span>
      <span class="elapsed">${elapsed}s</span>
    </div>
    <div class="result-body">${escapeHtml(body)}</div>
  `;
  panel.prepend(div);
}

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
