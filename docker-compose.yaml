services:
  gateway:
    image: nginx:alpine
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - yallmp
      - checkr
      - llogr
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10

  createbucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/llogr-raw-events;
      "

  yallmp:
    build:
      context: ./yallmp
    environment:
      LLM_HOST: "0.0.0.0"
      LLM_PORT: "5000"
      LLM_DEBUG: "false"
      LLM_DASHBOARD_ENABLED: "true"
      LLM_PROXY_TARGET_URL: "http://host.docker.internal:1234"
      LLM_PROXY_AUTHORIZATION_TYPE: "NONE"
      LLM_TRACING_ENABLED: "true"
      LLM_TRACING_BACKEND: "langfuse"
      LANGFUSE_HOST: "http://llogr:8000"
      LANGFUSE_PUBLIC_KEY: "pk-local"
      LANGFUSE_SECRET_KEY: "sk-local"
    env_file:
      - ./yallmp/.env
    restart: unless-stopped

  checkr:
    build:
      context: ./checkr
    environment:
      CHECKR_HOST: "0.0.0.0"
      CHECKR_PORT: "5000"
      CHECKR_DEBUG: "false"
    env_file:
      - ./checkr/.env
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_PASSWORD: "clickhouse"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  clickstream:
    build:
      context: ./clickstream
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKSTREAM_CH_URL: "http://clickhouse:8123"
      CLICKSTREAM_CH_PASSWORD: "clickhouse"
      CLICKSTREAM_API_KEY: "clickstream-key"
    restart: unless-stopped

  llogr:
    build:
      context: ./llogr
    depends_on:
      createbucket:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    environment:
      LLOGR_S3_ENDPOINT: http://minio:9000
    volumes:
      - ./llogr/config.gateway.yaml:/app/config.yaml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - yallmp
      - checkr
      - llogr
      - clickstream
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/architecture-dashboard.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/architecture-dashboard.json:/var/lib/grafana/dashboards/architecture-dashboard.json:ro
      - ./grafana/business-metrics-dashboard.json:/var/lib/grafana/dashboards/business-metrics-dashboard.json:ro
      - ./yallmp/grafana/yallmp-dashboard.json:/var/lib/grafana/dashboards/yallmp-dashboard.json:ro
      - ./checkr/grafana/checkr-dashboard.json:/var/lib/grafana/dashboards/checkr-dashboard.json:ro
      - ./clickstream/grafana/clickstream-dashboard.json:/var/lib/grafana/dashboards/clickstream-dashboard.json:ro
      - ./llogr/grafana/llogr-dashboard.json:/var/lib/grafana/dashboards/llogr-dashboard.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  minio-data:
  clickhouse-data:
  grafana-data:
