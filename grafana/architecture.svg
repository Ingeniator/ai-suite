<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Inter, -apple-system, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#8b949e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#d29922"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="680" rx="12" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="700">AI Suite — Architecture &amp; Service Status</text>

  <!-- Legend -->
  <g transform="translate(720, 52)">
    <rect x="0" y="0" width="220" height="90" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <circle cx="18" cy="18" r="6" fill="#3fb950"/><text x="32" y="22" fill="#c9d1d9" font-size="11">Healthy</text>
    <circle cx="120" cy="18" r="6" fill="#f85149"/><text x="134" y="22" fill="#c9d1d9" font-size="11">Down</text>
    <line x1="14" y1="42" x2="50" y2="42" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="58" y="46" fill="#c9d1d9" font-size="11">HTTP traffic</text>
    <line x1="14" y1="62" x2="50" y2="62" stroke="#d29922" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowOrange)"/>
    <text x="58" y="66" fill="#c9d1d9" font-size="11">Traces / Events</text>
    <line x1="14" y1="82" x2="50" y2="82" stroke="#3fb950" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowGreen)"/>
    <text x="58" y="86" fill="#c9d1d9" font-size="11">Metrics scrape</text>
  </g>

  <!-- ==================== NODES ==================== -->

  <!-- External client -->
  <g id="node-client" transform="translate(420, 70)">
    <rect x="0" y="0" width="120" height="44" rx="22" fill="#30363d" stroke="#8b949e" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="60" y="27" text-anchor="middle" fill="#e6edf3" font-weight="600">Client</text>
  </g>

  <!-- NGINX Gateway -->
  <g id="node-nginx" transform="translate(395, 160)">
    <rect class="status-box" data-service="nginx" x="0" y="0" width="170" height="54" rx="10" fill="#21262d" stroke="#3fb950" stroke-width="2" filter="url(#shadow)"/>
    <circle class="status-dot" data-service="nginx" cx="20" cy="27" r="7" fill="#3fb950"/>
    <text x="90" y="24" text-anchor="middle" fill="#e6edf3" font-weight="700" font-size="14">nginx</text>
    <text x="90" y="40" text-anchor="middle" fill="#8b949e" font-size="11">gateway :8888</text>
  </g>

  <!-- yallmp -->
  <g id="node-yallmp" transform="translate(60, 290)">
    <rect class="status-box" data-service="yallmp" x="0" y="0" width="170" height="64" rx="10" fill="#21262d" stroke="#3fb950" stroke-width="2" filter="url(#shadow)"/>
    <circle class="status-dot" data-service="yallmp" cx="20" cy="20" r="7" fill="#3fb950"/>
    <text x="90" y="24" text-anchor="middle" fill="#e6edf3" font-weight="700" font-size="14">yallmp</text>
    <text x="90" y="40" text-anchor="middle" fill="#8b949e" font-size="11">LLM Proxy :5000</text>
    <text x="90" y="54" text-anchor="middle" fill="#8b949e" font-size="10">/ai/*</text>
  </g>

  <!-- checkr -->
  <g id="node-checkr" transform="translate(280, 290)">
    <rect class="status-box" data-service="checkr" x="0" y="0" width="170" height="64" rx="10" fill="#21262d" stroke="#3fb950" stroke-width="2" filter="url(#shadow)"/>
    <circle class="status-dot" data-service="checkr" cx="20" cy="20" r="7" fill="#3fb950"/>
    <text x="90" y="24" text-anchor="middle" fill="#e6edf3" font-weight="700" font-size="14">checkr</text>
    <text x="90" y="40" text-anchor="middle" fill="#8b949e" font-size="11">Validation :5000</text>
    <text x="90" y="54" text-anchor="middle" fill="#8b949e" font-size="10">/validators/*</text>
  </g>

  <!-- llogr -->
  <g id="node-llogr" transform="translate(500, 290)">
    <rect class="status-box" data-service="llogr" x="0" y="0" width="170" height="64" rx="10" fill="#21262d" stroke="#3fb950" stroke-width="2" filter="url(#shadow)"/>
    <circle class="status-dot" data-service="llogr" cx="20" cy="20" r="7" fill="#3fb950"/>
    <text x="90" y="24" text-anchor="middle" fill="#e6edf3" font-weight="700" font-size="14">llogr</text>
    <text x="90" y="40" text-anchor="middle" fill="#8b949e" font-size="11">Trace Collector :8000</text>
    <text x="90" y="54" text-anchor="middle" fill="#8b949e" font-size="10">/llogr/*</text>
  </g>

  <!-- clickstream -->
  <g id="node-clickstream" transform="translate(720, 290)">
    <rect class="status-box" data-service="clickstream" x="0" y="0" width="170" height="64" rx="10" fill="#21262d" stroke="#3fb950" stroke-width="2" filter="url(#shadow)"/>
    <circle class="status-dot" data-service="clickstream" cx="20" cy="20" r="7" fill="#3fb950"/>
    <text x="90" y="24" text-anchor="middle" fill="#e6edf3" font-weight="700" font-size="14">clickstream</text>
    <text x="90" y="40" text-anchor="middle" fill="#8b949e" font-size="11">Event Collector :9999</text>
    <text x="90" y="54" text-anchor="middle" fill="#8b949e" font-size="10">/2/httpapi</text>
  </g>

  <!-- minio -->
  <g id="node-minio" transform="translate(340, 440)">
    <rect class="status-box" data-service="minio" x="0" y="0" width="150" height="54" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="75" y="24" text-anchor="middle" fill="#e6edf3" font-weight="700" font-size="14">minio</text>
    <text x="75" y="40" text-anchor="middle" fill="#8b949e" font-size="11">S3 Storage :9000</text>
  </g>

  <!-- clickhouse -->
  <g id="node-clickhouse" transform="translate(600, 440)">
    <rect class="status-box" data-service="clickhouse" x="0" y="0" width="170" height="54" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="85" y="24" text-anchor="middle" fill="#e6edf3" font-weight="700" font-size="14">clickhouse</text>
    <text x="85" y="40" text-anchor="middle" fill="#8b949e" font-size="11">Event DB :8123</text>
  </g>

  <!-- Prometheus -->
  <g id="node-prometheus" transform="translate(100, 440)">
    <rect x="0" y="0" width="160" height="54" rx="10" fill="#21262d" stroke="#d29922" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="80" y="24" text-anchor="middle" fill="#e6edf3" font-weight="700" font-size="14">prometheus</text>
    <text x="80" y="40" text-anchor="middle" fill="#8b949e" font-size="11">Metrics :9090</text>
  </g>

  <!-- Alertmanager -->
  <g id="node-alertmanager" transform="translate(100, 560)">
    <rect x="0" y="0" width="160" height="54" rx="10" fill="#21262d" stroke="#f85149" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="80" y="24" text-anchor="middle" fill="#e6edf3" font-weight="700" font-size="14">alertmanager</text>
    <text x="80" y="40" text-anchor="middle" fill="#8b949e" font-size="11">Alerts :9093</text>
  </g>

  <!-- Grafana -->
  <g id="node-grafana" transform="translate(340, 560)">
    <rect x="0" y="0" width="150" height="54" rx="10" fill="#21262d" stroke="#d29922" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="75" y="24" text-anchor="middle" fill="#e6edf3" font-weight="700" font-size="14">grafana</text>
    <text x="75" y="40" text-anchor="middle" fill="#8b949e" font-size="11">Dashboards :3000</text>
  </g>

  <!-- Blackbox Exporter -->
  <g id="node-blackbox" transform="translate(600, 560)">
    <rect x="0" y="0" width="170" height="54" rx="10" fill="#21262d" stroke="#d29922" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="85" y="24" text-anchor="middle" fill="#e6edf3" font-weight="700" font-size="14">blackbox</text>
    <text x="85" y="40" text-anchor="middle" fill="#8b949e" font-size="11">Probe Exporter :9115</text>
  </g>

  <!-- ==================== EDGES ==================== -->

  <!-- Client → Nginx -->
  <line x1="480" y1="114" x2="480" y2="158" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Nginx → yallmp -->
  <path d="M420,214 Q320,250 210,288" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Nginx → checkr -->
  <path d="M460,214 Q420,250 400,288" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Nginx → llogr -->
  <path d="M500,214 Q540,250 560,288" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Nginx → minio (presigned /s3/*) -->
  <path d="M545,214 Q600,300 460,438" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowBlue)"/>
  <text x="570" y="310" fill="#58a6ff" font-size="9" transform="rotate(-40,570,310)">/s3/* presigned</text>

  <!-- checkr → yallmp (LLM-as-judge) -->
  <line x1="280" y1="315" x2="232" y2="315" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>
  <text x="254" y="308" text-anchor="middle" fill="#58a6ff" font-size="9">LLM judge</text>

  <!-- yallmp → llogr (traces) -->
  <path d="M230,340 Q370,380 520,354" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowOrange)"/>
  <text x="380" y="372" text-anchor="middle" fill="#d29922" font-size="9">traces</text>

  <!-- llogr → minio (S3 save) -->
  <path d="M555,354 Q480,400 445,438" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowOrange)"/>
  <text x="486" y="400" fill="#d29922" font-size="9">S3 events</text>

  <!-- llogr → clickhouse (search index) -->
  <path d="M620,354 Q650,400 670,438" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowOrange)"/>
  <text x="656" y="398" fill="#d29922" font-size="9">index</text>

  <!-- llogr → clickstream (forward) -->
  <line x1="670" y1="322" x2="718" y2="322" stroke="#d29922" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowOrange)"/>
  <text x="694" y="314" text-anchor="middle" fill="#d29922" font-size="9">forward</text>

  <!-- clickstream → clickhouse -->
  <path d="M805,354 Q790,400 740,438" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowOrange)"/>
  <text x="790" y="398" fill="#d29922" font-size="9">write</text>

  <!-- Prometheus scrapes (green dashed) -->
  <path d="M180,440 L180,370 Q180,360 170,354" fill="none" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowGreen)"/>
  <path d="M190,440 Q280,400 330,354" fill="none" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowGreen)"/>
  <path d="M200,440 Q400,380 540,354" fill="none" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowGreen)"/>
  <path d="M210,440 Q500,380 760,354" fill="none" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowGreen)"/>

  <!-- Prometheus → Alertmanager -->
  <line x1="180" y1="494" x2="180" y2="558" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="530" fill="#f85149" font-size="9">alerts</text>

  <!-- Prometheus → Grafana -->
  <line x1="260" y1="480" x2="338" y2="580" stroke="#d29922" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowOrange)"/>

  <!-- Blackbox → probes (conceptual) -->
  <path d="M685,560 Q800,450 810,354" fill="none" stroke="#3fb950" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#arrowGreen)"/>
  <text x="780" y="460" fill="#3fb950" font-size="9" transform="rotate(-70,780,460)">probes</text>

  <!-- X-Request-ID annotation -->
  <g transform="translate(20, 636)">
    <rect x="0" y="0" width="920" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="460" y="20" text-anchor="middle" fill="#8b949e" font-size="11">All HTTP traffic carries <tspan fill="#58a6ff" font-weight="600">X-Request-ID</tspan> for distributed tracing across nginx, yallmp, checkr, llogr</text>
  </g>
</svg>
